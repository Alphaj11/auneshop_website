# Vitrine statique sur GitHub Pages : une photographie des pages publiques du site,
# régénérée à chaque mise à jour de main. Voir scripts/build-vitrine.mjs.
# Le site généré est poussé sur la branche vitrine-pages, que GitHub Pages publie
# (Settings › Pages › Deploy from a branch › vitrine-pages, dossier racine).
# Aucun secret n'est utilisé : la base est une base jetable remplie avec les données de démo.
name: Vitrine GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aune
          POSTGRES_PASSWORD: aune_ci
          POSTGRES_DB: auneshop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aune"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://aune:aune_ci@localhost:5432/auneshop
      APP_URL: https://alphaj11.github.io/auneshop_website
      PAYMENT_MODE: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Secrets jetables pour la construction
        run: |
          echo "SESSION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "DEMO_PASSWORD=$(openssl rand -hex 12)" >> "$GITHUB_ENV"
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run build:vitrine
      - name: Publication sur la branche vitrine-pages
        run: |
          cd out
          git init -q -b vitrine-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Vitrine générée depuis ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" vitrine-pages
